<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – Prisijungimas prie valdymo pulto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#fcfdfc] text-slate-800 antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- Navigacija su kalbos perjungikliu -->
  <header class="max-w-md mx-auto w-full py-3 flex justify-between items-center border-b border-slate-100">
    <a href="index.html" class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
      <span class="text-xl font-bold tracking-tight text-slate-900">QR Hope</span>
    </a>
    <div class="flex items-center space-x-2">
      <button onclick="toggleLanguage()" id="langBtn" class="text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-1 rounded-md hover:bg-emerald-100 transition">
        EN
      </button>
      <a href="index.html" id="t_homeLink" class="text-xs text-slate-500 hover:text-slate-800 font-medium">Pradžia</a>
    </div>
  </header>

  <!-- Pagrindinė prisijungimo kortelė -->
  <main class="max-w-md mx-auto w-full my-8 bg-white border border-slate-200/90 rounded-2xl p-6 sm:p-7 shadow-sm space-y-6">
    <div>
      <span id="t_badge" class="text-[10px] font-bold text-emerald-800 uppercase tracking-wider">Savininko prieiga</span>
      <h1 id="t_title" class="text-2xl font-extrabold text-slate-950 mt-1">Prisijunkite prie pulto</h1>
      <p id="t_desc" class="text-xs text-slate-500 mt-1">Įveskite savo pakabuko ID kodą ir apsauginį PIN kodą.</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label id="t_label_id" class="block font-semibold text-slate-700 mb-1">Pakabuko ID kodas</label>
        <input id="loginId" type="text" required placeholder="Pvz., SOS-001" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 font-mono text-slate-900 font-bold uppercase focus:outline-none focus:border-emerald-700" />
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label id="t_label_pin" class="font-semibold text-slate-700">Apsauginis PIN kodas</label>
          <span id="t_pin_hint" class="text-[10px] text-slate-400">4 skaitmenys</span>
        </div>
        <input id="loginPin" type="password" maxlength="4" pattern="[0-9]{4}" required placeholder="••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 font-mono text-center tracking-[0.3em] text-slate-900 text-sm font-bold focus:outline-none focus:border-emerald-700" />
      </div>

      <button id="loginBtn" type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-sm text-sm">
        <span id="t_btn">Prisijungti</span>
      </button>
    </form>

    <div id="loginStatus" class="hidden text-center text-xs p-3 rounded-xl"></div>

    <div class="border-t border-slate-100 pt-4 text-center text-xs text-slate-500 space-y-1">
      <p id="t_not_active">Dar neaktyvavote savo pakabuko?</p>
      <a href="register.html" id="t_act_link" class="font-bold text-emerald-800 hover:underline">Aktyvuoti naują žymą čia</a>
    </div>
  </main>

  <footer class="max-w-md mx-auto w-full text-center text-[11px] text-slate-400 py-4">
    <span id="t_footer">QR Hope &copy; 2026. Saugi valdymo sistema.</span>
  </footer>

  <script>
    const SUPABASE_URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";

    let currentLang = localStorage.getItem('qrhope_lang') || 'lt';

    const I18N = {
      lt: {
        langBtn: 'EN',
        homeLink: 'Pradžia',
        badge: 'Savininko prieiga',
        title: 'Prisijunkite prie pulto',
        desc: 'Įveskite savo pakabuko ID kodą ir apsauginį PIN kodą.',
        label_id: 'Pakabuko ID kodas',
        label_pin: 'Apsauginis PIN kodas',
        pin_hint: '4 skaitmenys',
        btn: 'Prisijungti',
        btn_loading: 'Tikrinama...',
        not_active: 'Dar neaktyvavote savo pakabuko?',
        act_link: 'Aktyvuoti naują žymą čia',
        footer: 'QR Hope © 2026. Saugi valdymo sistema.',
        err_invalid: 'Neteisingas ID arba PIN kodas.',
        err_conn: 'Ryšio klaida. Bandykite dar kartą.'
      },
      en: {
        langBtn: 'LT',
        homeLink: 'Home',
        badge: 'Owner Access',
        title: 'Sign In to Dashboard',
        desc: 'Enter your smart tag ID and 4-digit security PIN.',
        label_id: 'Smart Tag ID',
        label_pin: 'Security PIN',
        pin_hint: '4 digits',
        btn: 'Sign In',
        btn_loading: 'Verifying...',
        not_active: 'Haven’t activated your tag yet?',
        act_link: 'Activate new tag here',
        footer: 'QR Hope © 2026. Secure management platform.',
        err_invalid: 'Invalid Tag ID or PIN code.',
        err_conn: 'Network error. Please try again.'
      }
    };

    function renderLanguage() {
      const d = I18N[currentLang];
      document.getElementById('langBtn').innerText = d.langBtn;
      document.getElementById('t_homeLink').innerText = d.homeLink;
      document.getElementById('t_badge').innerText = d.badge;
      document.getElementById('t_title').innerText = d.title;
      document.getElementById('t_desc').innerText = d.desc;
      document.getElementById('t_label_id').innerText = d.label_id;
      document.getElementById('t_label_pin').innerText = d.label_pin;
      document.getElementById('t_pin_hint').innerText = d.pin_hint;
      document.getElementById('t_btn').innerText = d.btn;
      document.getElementById('t_not_active').innerText = d.not_active;
      document.getElementById('t_act_link').innerText = d.act_link;
      document.getElementById('t_footer').innerText = d.footer;
    }

    function toggleLanguage() {
      currentLang = (currentLang === 'lt') ? 'en' : 'lt';
      localStorage.setItem('qrhope_lang', currentLang);
      renderLanguage();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const d = I18N[currentLang];
      const btn = document.getElementById('loginBtn');
      const status = document.getElementById('loginStatus');
      const tagId = document.getElementById('loginId').value.trim().toUpperCase();
      const pin = document.getElementById('loginPin').value.trim();

      btn.disabled = true;
      document.getElementById('t_btn').innerText = d.btn_loading;
      status.classList.add('hidden');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tags?id=eq.${encodeURIComponent(tagId)}&pin_code=eq.${encodeURIComponent(pin)}&select=id`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) throw new Error("Connection failed");

        const data = await res.json();

        if (data && data.length > 0) {
          localStorage.setItem('qrhope_current_tag', tagId);
          status.className = "bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs p-3 rounded-xl text-center block";
          status.innerText = currentLang === 'lt' ? 'Sėkmingai prisijungta! Nukreipiama...' : 'Success! Redirecting...';
          
          setTimeout(() => {
            window.location.href = `dashboard.html?id=${encodeURIComponent(tagId)}`;
          }, 800);
        } else {
          status.className = "bg-rose-50 border border-rose-200 text-rose-800 text-xs p-3 rounded-xl text-center block";
          status.innerText = d.err_invalid;
          btn.disabled = false;
          document.getElementById('t_btn').innerText = d.btn;
        }
      } catch (err) {
        status.className = "bg-rose-50 border border-rose-200 text-rose-800 text-xs p-3 rounded-xl text-center block";
        status.innerText = d.err_conn;
        btn.disabled = false;
        document.getElementById('t_btn').innerText = d.btn;
      }
    }

    renderLanguage();
  </script>
</body>
</html>
