<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – Valdymo pultas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QR kodo biblioteka -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body class="bg-[#fcfdfc] text-slate-800 antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- Navigacija -->
  <header class="max-w-4xl mx-auto w-full py-4 flex justify-between items-center border-b border-slate-100">
    <a href="index.html" class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
      <span class="text-xl font-bold tracking-tight text-slate-900">QR Hope</span>
    </a>
    <div class="flex items-center space-x-3 text-xs">
      <a href="index.html" class="text-slate-500 hover:text-slate-800">Pradžia</a>
      <button onclick="logout()" class="text-rose-600 font-bold hover:underline">Atsijungti</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full my-6 space-y-6">

    <!-- Viršutinė kortelė: Pagrindinė informacija ir būsena -->
    <div class="bg-white border border-slate-200/90 rounded-2xl p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <div class="flex items-center space-x-2">
          <h1 id="dashName" class="text-2xl font-black text-slate-950">Kraunama...</h1>
          <span id="dashTagId" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono font-bold">#ID</span>
        </div>
        <p id="dashDetails" class="text-xs text-slate-500 mt-1"></p>
      </div>

      <!-- Lost Mode mygtukas -->
      <div class="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <span class="text-xs font-bold text-slate-700">Paieškos būsena:</span>
        <button id="lostToggleBtn" onclick="toggleLostMode()" class="px-4 py-2 rounded-lg font-bold text-xs transition bg-slate-200 text-slate-700">
          Kraunama...
        </button>
      </div>
    </div>

    <!-- QR Kodo generatoriaus ir atsisiuntimo blokas -->
    <div class="bg-white border border-slate-200/90 rounded-2xl p-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-6">
      <div class="flex items-center space-x-5">
        <div id="qrcode" class="p-2 bg-white border border-slate-200 rounded-xl shadow-xs shrink-0"></div>
        <div class="space-y-1">
          <h2 class="text-sm font-bold text-slate-900">Jūsų žymos QR kodas</h2>
