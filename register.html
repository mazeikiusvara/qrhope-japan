  <header class="max-w-md mx-auto w-full py-3 flex justify-between items-center border-b border-slate-100">
    <a href="index.html" class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
      <span class="text-xl font-bold tracking-tight text-slate-900">QR Hope</span>

    <a href="index.html" class="text-xs text-slate-500 hover:text-slate-800 font-medium">Grįžti į pradžią</a>

      <h1 class="text-2xl font-extrabold text-slate-950 mt-1">Aktyvuokite savo apsaugą</h1>
      <p class="text-xs text-slate-500 mt-1">Supildykite duomenis, kad radėjas galėtų susisiekti per saugią sistemą neatidengiant jūsų numerio.</p>
    </div>

    <form id="activateForm" onsubmit="handleActivation(event)" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Pakabuko ID kodas</label>
        <input id="tagId" type="text" required placeholder="Pvz., SOS-001" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 font-mono text-slate-800 font-bold uppercase focus:outline-none focus:border-emerald-700" />
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Tipas</label>
        <select id="tagType" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 focus:outline-none focus:border-emerald-600">
          <option value="pet">Augintinis (šuo, katė)</option>
          <option value="item">Asmeninis daiktas (lagaminas, raktai, piniginė)</option>
          <option value="sos">SOS / Medicininė apsauga (vaikui, senjorui)</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Vardas / Pavadinimas</label>
        <input id="tagName" type="text" required placeholder="Pvz., Reksas arba Kelioninis lagaminas" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 focus:outline-none focus:border-emerald-600" />
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Jūsų el. pašto adresas (pranešimams)</label>
        <input id="userEmail" type="email" required placeholder="vardas@pastas.lt" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 focus:outline-none focus:border-emerald-600" />
