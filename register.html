<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – Pakabuko aktyvavimas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-6 px-4 font-sans text-slate-800">

  <div class="max-w-md mx-auto mb-3">
    <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-slate-800 bg-white border border-slate-200 px-3 py-1.5 rounded-full shadow-sm transition">
      <span>←</span> Grįžti į pradžią
    </a>
  </div>

  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
    
    <div class="bg-emerald-600 text-white p-6 text-center">
      <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-black">
        QR
      </div>
      <h1 class="text-xl font-black">Pakabuko aktyvavimas</h1>
      <p class="text-xs text-emerald-100 mt-1">Anonimiška pagalbos ir apsaugos sistema</p>
    </div>

    <form id="tagForm" onsubmit="saveTag(event)" class="p-6 space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Pakabuko ID:</label>
        <input type="text" id="tagId" required placeholder="Pvz. SOS-002 arba PET-002"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono focus:outline-none focus:border-emerald-600">
      </div>

      <!-- Sugeneruotas PIN kodas anoniminiams skambučiams -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-slate-600">Saugus PIN skambučiams (GSM):</label>
          <button type="button" onclick="generatePin()" class="text-[11px] text-emerald-600 font-bold hover:underline">Sugeneruoti naują</button>
        </div>
        <input type="text" id="pinCode" readonly required
               class="w-full bg-slate-100 border border-slate-300 rounded-xl px-3 py-2 text-base font-black tracking-widest text-center text-slate-800 font-mono">
        <p class="text-[10px] text-slate-400 mt-0.5">Šis PIN naudojamas skambučio peradresavimui neatskleidžiant jūsų numerio.</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Kategorija:</label>
        <select id="tagType" onchange="toggleFields()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
          <option value="sos">🚨 Skubi pagalba (Žmogui / Senjorui / Vaikui)</option>
          <option value="pet">🐾 Pamestas gyvūnas / Daiktas</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1" id="nameLabel">Vardas, Pavardė:</label>
        <input type="text" id="name" required placeholder="Įveskite vardą"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1" id="ageLabel">Amžius:</label>
        <input type="text" id="age" placeholder="Pvz. 72 m. arba 3 metai"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Tikrasis telefono numeris (Paslėptas nuo pašalinių):</label>
        <input type="tel" id="phone" required placeholder="+37060000000"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
        <p class="text-[10px] text-slate-400 mt-0.5">🛡️ Numeris niekada nebus viešai rodomas pakabuką nuskaičiusiems asmenims.</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1" id="detailsLabel">Svarbi informacija / Ligos:</label>
        <textarea id="details" rows="2" placeholder="Svarbi informacija radusiam žmogui"
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600"></textarea>
      </div>

      <div id="sosOnlyField">
        <label class="block text-xs font-bold text-slate-600 mb-1">Kritinė medicininė informacija:</label>
        <input type="text" id="criticalInfo" placeholder="Kraujo grupė, vaistai, alergijos, diabetas..."
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <div id="petOnlyField" class="hidden">
        <label class="block text-xs font-bold text-slate-600 mb-1">Siūlomas atlygis radusiam:</label>
        <input type="text" id="reward" placeholder="Pvz. 50 €"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <button type="submit" id="submitBtn"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm shadow transition">
        Išsaugoti ir Aktyvuoti
      </button>

      <div id="statusMsg" class="hidden p-3 rounded-xl text-center text-xs font-bold mt-2"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";

    function generatePin() {
      const pin = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('pinCode').value = pin;
    }
    generatePin();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('id')) {
      document.getElementById('tagId').value = urlParams.get('id');
    }

    function toggleFields() {
      const type = document.getElementById('tagType').value;
      if (type === 'pet') {
        document.getElementById('nameLabel').innerText = "Gyvūno vardas / Daikto pavadinimas:";
        document.getElementById('ageLabel').innerText = "Veislė / Spalva / Požymiai:";
        document.getElementById('detailsLabel').innerText = "Būdo bruožai / Papildoma informacija:";
        document.getElementById('sosOnlyField').classList.add('hidden');
        document.getElementById('petOnlyField').classList.remove('hidden');
      } else {
        document.getElementById('nameLabel').innerText = "Vardas, Pavardė:";
        document.getElementById('ageLabel').innerText = "Amžius:";
        document.getElementById('detailsLabel').innerText = "Svarbi informacija / Ligos:";
        document.getElementById('sosOnlyField').classList.remove('hidden');
        document.getElementById('petOnlyField').classList.add('hidden');
      }
    }

    async function saveTag(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');

      btn.disabled = true;
      btn.innerText = "Išsaugoma...";

      const payload = {
        id: document.getElementById('tagId').value.trim(),
        pin_code: document.getElementById('pinCode').value.trim(),
        type: document.getElementById('tagType').value,
        name: document.getElementById('name').value.trim(),
        age: document.getElementById('age').value.trim(),
        emergency_phone: document.getElementById('phone').value.trim(),
        details: document.getElementById('details').value.trim(),
        critical_info: document.getElementById('criticalInfo').value.trim(),
        reward: document.getElementById('reward').value.trim()
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tags`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Nepavyko išsaugoti.');

        status.className = "p-3 rounded-xl text-center text-xs font-bold mt-2 bg-emerald-100 text-emerald-800";
        status.innerHTML = `✅ Sėkmingai išsaugota! PIN: <b>${payload.pin_code}</b><br><a href="s.html?id=${payload.id}" class="underline font-bold mt-1 inline-block">Atidaryti pakabuko kortelę</a>`;
        status.classList.remove('hidden');
      } catch (err) {
        status.className = "p-3 rounded-xl text-center text-xs font-bold mt-2 bg-red-100 text-red-800";
        status.innerText = "❌ Klaida išsaugant duomenis.";
        status.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "Išsaugoti ir Aktyvuoti";
      }
    }
  </script>
</body>
</html>
