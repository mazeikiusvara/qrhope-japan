<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – タグ登録 (Pakabuko Aktyvavimas)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 font-sans text-slate-800">

  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
    
    <!-- Antraštė -->
    <div class="bg-emerald-600 text-white p-6 text-center">
      <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-black">
        QR
      </div>
      <h1 class="text-xl font-black">タグの初期設定・登録</h1>
      <p class="text-xs text-emerald-100 mt-1">Pakabuko aktyvavimas ir duomenų susiejimas</p>
    </div>

    <!-- Forma -->
    <form id="tagForm" onsubmit="saveTag(event)" class="p-6 space-y-4">
      
      <!-- Pakabuko ID -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">タグID (Pakabuko ID):</label>
        <input type="text" id="tagId" required placeholder="Pvz. SOS-002 arba PET-002"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono focus:outline-none focus:border-emerald-600">
      </div>

      <!-- Tipas -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">カテゴリー (Tipas):</label>
        <select id="tagType" onchange="toggleFields()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
          <option value="sos">🚨 緊急医療 (SOS žmogui / senjorui)</option>
          <option value="pet">🐾 迷子ペット・落とし物 (Gyvūnui / daiktui)</option>
        </select>
      </div>

      <!-- Vardas -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1" id="nameLabel">氏名 (Vardas Pavardė):</label>
        <input type="text" id="name" required placeholder="Vardas"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <!-- Amžius / Veislė -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1" id="ageLabel">年齢 (Amžius):</label>
        <input type="text" id="age" placeholder="Pvz. 72 metai arba 3 metai"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <!-- Kontaktai -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">緊急連絡先 (Skubus tel. numeris):</label>
        <input type="tel" id="phone" required placeholder="+37060000000"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
        <p class="text-[10px] text-slate-400 mt-0.5">Numeris skambučio metu praeiviams nebus viešai rodomas.</p>
      </div>

      <!-- Detalės / Aprašymas -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1" id="detailsLabel">既往症・特記事項 (Ligos / Pastabos):</label>
        <textarea id="details" rows="2" placeholder="Svarbi informacija radusiam žmogui"
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600"></textarea>
      </div>

      <!-- Kritinė info (rodoma tik SOS) -->
      <div id="sosOnlyField">
        <label class="block text-xs font-bold text-slate-600 mb-1">緊急医療メモ (Kritinė medicinos info):</label>
        <input type="text" id="criticalInfo" placeholder="Kraujo grupė, vartojami vaistai, alergijos"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <!-- Atlygis (rodoma tik Gyvūnui) -->
      <div id="petOnlyField" class="hidden">
        <label class="block text-xs font-bold text-slate-600 mb-1">お礼金 (Atlygis / Premija):</label>
        <input type="text" id="reward" placeholder="Pvz. 100 € arba 10,000 円"
               class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
      </div>

      <!-- Mygtukas -->
      <button type="submit" id="submitBtn"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm shadow transition">
        保存してタグを有効化 (Išsaugoti ir Aktyvuoti)
      </button>

      <div id="statusMsg" class="hidden p-3 rounded-xl text-center text-xs font-bold mt-2"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";

    // Automatiškai užpildyti ID iš URL, pvz. register.html?id=SOS-005
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('id')) {
      document.getElementById('tagId').value = urlParams.get('id');
    }

    function toggleFields() {
      const type = document.getElementById('tagType').value;
      if (type === 'pet') {
        document.getElementById('nameLabel').innerText = "ペット名 / 品名 (Gyvūno vardas / Daiktas):";
        document.getElementById('ageLabel').innerText = "品種・特徴 (Veislė / Spalva):";
        document.getElementById('detailsLabel').innerText = "性格・特徴 (Charakteris / Požymiai):";
        document.getElementById('sosOnlyField').classList.add('hidden');
        document.getElementById('petOnlyField').classList.remove('hidden');
      } else {
        document.getElementById('nameLabel').innerText = "氏名 (Vardas Pavardė):";
        document.getElementById('ageLabel').innerText = "年齢 (Amžius):";
        document.getElementById('detailsLabel').innerText = "既往症・特記事項 (Ligos / Diagnozė):";
        document.getElementById('sosOnlyField').classList.remove('hidden');
        document.getElementById('petOnlyField').classList.add('hidden');
      }
    }

    async function saveTag(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');

      btn.disabled = true;
      btn.innerText = "Saugoma...";

      const payload = {
        id: document.getElementById('tagId').value.trim(),
        type: document.getElementById('tagType').value,
        name: document.getElementById('name').value.trim(),
        age: document.getElementById('age').value.trim(),
        emergency_phone: document.getElementById('phone').value.trim(),
        details: document.getElementById('details').value.trim(),
        critical_info: document.getElementById('criticalInfo').value.trim(),
        reward: document.getElementById('reward').value.trim()
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tags`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Nepavyko išsaugoti duomenų.');

        status.className = "p-3 rounded-xl text-center text-xs font-bold mt-2 bg-emerald-100 text-emerald-800";
        status.innerHTML = `✅ Aktyvuota! <br><a href="s.html?id=${payload.id}" class="underline">Peržiūrėti nuskaitymo kortelę</a>`;
        status.classList.remove('hidden');
      } catch (err) {
        status.className = "p-3 rounded-xl text-center text-xs font-bold mt-2 bg-red-100 text-red-800";
        status.innerText = "❌ Klaida išsaugant. Patikrinkite duomenis.";
        status.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "保存してタグを有効化 (Išsaugoti)";
      }
    }
  </script>
</body>
</html>
