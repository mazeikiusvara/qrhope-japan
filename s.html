<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – Radėjo vaizdas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col justify-between p-4">

  <header class="max-w-md mx-auto w-full py-2 flex justify-between items-center border-b border-slate-200">
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
      <span class="text-lg font-black tracking-tight text-slate-900">QR<span class="text-emerald-800">HOPE</span></span>
    </div>
    <a id="backToDashBtn" href="#" class="hidden text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-300 px-3 py-1.5 rounded-xl hover:bg-emerald-100 transition">
      <i class="fa-solid fa-arrow-left mr-1"></i>Grįžti į pultą
    </a>
  </header>

  <main class="max-w-md mx-auto w-full my-6">
    <div id="loadingBox" class="bg-white border rounded-3xl p-6 text-center text-xs font-bold text-slate-500">
      Kraunami duomenys...
    </div>

    <div id="contentBox" class="hidden bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
      <div class="flex justify-between items-start">
        <div>
          <span id="typeBadge" class="text-[10px] font-black uppercase bg-emerald-50 text-emerald-800 px-2.5 py-0.5 rounded-full">Daiktas</span>
          <h1 id="tagName" class="text-xl font-black text-slate-950 mt-1"></h1>
        </div>
        <span id="tagIdBadge" class="text-xs font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded"></span>
      </div>

      <div id="lostBanner" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-2">
        <div class="flex items-center space-x-2 text-rose-700 font-black text-xs uppercase">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>Objektas pažymėtas kaip pamestas!</span>
        </div>
        <p id="lostMessage" class="text-xs text-rose-950 font-medium"></p>
        <div id="rewardBadge" class="hidden text-xs font-black text-emerald-800 bg-emerald-100/70 border border-emerald-300 p-2 rounded-xl text-center"></div>
      </div>

      <!-- PRADINĖ ŽINUTĖS SIUNTIMO FORMA (MATOMA KOL NEPARAŠYTA) -->
      <div id="initialForm" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
        <h2 class="text-xs font-black text-slate-900">
          <i class="fa-solid fa-envelope-open-text mr-1 text-emerald-700"></i> Radote šį daiktą? Praneškite savininkui
        </h2>
        <textarea id="finderMsg" rows="3" placeholder="Parašykite žinutę savininkui (kur radote)..." class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs text-slate-900 focus:outline-none focus:border-emerald-600"></textarea>
        <button onclick="sendInitialAlert()" id="alertBtn" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3 rounded-xl transition text-xs shadow-sm cursor-pointer">
          <i class="fa-solid fa-paper-plane mr-1"></i> Nusiųsti žinutę ir GPS vietą
        </button>
      </div>

      <!-- MESSENGER POKALBIŲ LANGAS (ATSIRANDA TIK IŠSIUNTUS ŽINUTĘ) -->
      <div id="chatContainer" class="hidden bg-slate-900 text-slate-100 border border-slate-800 rounded-3xl p-4 shadow-xl space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <h2 class="text-xs font-black uppercase tracking-wider text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-comments"></i> Pokalbis su savininku
          </h2>
          <span class="text-[10px] text-emerald-400 font-bold">Aktyvus ryšys 📍</span>
        </div>

        <div id="finderChatMessages" class="bg-slate-950 border border-slate-800 rounded-2xl p-3 h-44 overflow-y-auto space-y-2.5 text-xs"></div>

        <div class="flex gap-2">
          <input id="finderReplyInput" type="text" placeholder="Rašyti atsakymą..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-600" />
          <button onclick="sendFinderReply()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition shadow-sm cursor-pointer">
            Siųsti
          </button>
        </div>
      </div>

      <div id="gpsStatus" class="hidden text-xs p-2.5 rounded-xl text-center font-bold"></div>
    </div>
  </main>

  <footer class="max-w-md mx-auto w-full text-center text-[10px] text-slate-400 py-3">
    QR Hope &copy; 2026.
  </footer>

  <script>
    var SUPABASE_URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";
    var currentTagId = "";
    var userGpsUrl = "";

    document.addEventListener("DOMContentLoaded", async function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var isPreview = params.get('preview');

      if (!id) { document.getElementById('loadingBox').innerText = "Žymos ID nenurodytas"; return; }
      currentTagId = id.toUpperCase();

      if (isPreview === '1' || localStorage.getItem('qrhope_logged_tag_' + currentTagId)) {
        var backBtn = document.getElementById('backToDashBtn');
        backBtn.href = "dashboard.html?id=" + currentTagId;
        backBtn.classList.remove('hidden');
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          userGpsUrl = "https://maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        });
      }

      await loadTagData();
      setInterval(loadTagData, 5000);
    });

    async function loadTagData() {
      try {
        var res = await fetch(SUPABASE_URL + "/rest/v1/tags?id=eq." + encodeURIComponent(currentTagId) + "&select=*", {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        var data = await res.json();
        if (!data || !data.length) { document.getElementById('loadingBox').innerText = "Žyma nerasta"; return; }
        
        var tag = data[0];
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('contentBox').classList.remove('hidden');

        document.getElementById('tagName').innerText = tag.name || 'Gaminys';
        document.getElementById('tagIdBadge').innerText = '#' + tag.id;

        if (tag.lost_mode) {
          document.getElementById('lostBanner').classList.remove('hidden');
          document.getElementById('lostMessage').innerText = tag.lost_message || 'Savininkas ieško šio objekto.';
          if (tag.reward) {
            document.getElementById('rewardBadge').classList.remove('hidden');
            document.getElementById('rewardBadge').innerText = '🎁 Siūlomas atlygis: ' + tag.reward;
          }
        }

        var history = [];
        try { history = JSON.parse(tag.chat_history || '[]'); } catch(e){}

        if (history.length > 0) {
          document.getElementById('initialForm').classList.add('hidden');
          document.getElementById('chatContainer').classList.remove('hidden');
          renderFinderChat(history);
        }
      } catch(e) {}
    }

    async function sendInitialAlert() {
      var msg = document.getElementById('finderMsg').value.trim();
      var btn = document.getElementById('alertBtn');
      var statusDiv = document.getElementById('gpsStatus');

      btn.disabled = true;
      btn.innerText = "Siunčiama...";

      var fullText = msg || "Radau jūsų daiktą!";
      if (userGpsUrl) fullText += " | GPS vieta: " + userGpsUrl;

      var history = [{ sender: 'finder', text: fullText, time: new Date().toISOString() }];

      try {
        await fetch(SUPABASE_URL + "/rest/v1/tags?id=eq." + encodeURIComponent(currentTagId), {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_history: JSON.stringify(history), lost_message: "🚨 RADĖJAS PRANEŠĖ: " + fullText })
        });

        // Išsiunčiame el. laišką per Supabase funkciją
        await fetch(SUPABASE_URL + "/functions/v1/send-reset-code", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tag_id: currentTagId, finder_message: fullText, gps_url: userGpsUrl })
        }).catch(function(){});

        document.getElementById('initialForm').classList.add('hidden');
        document.getElementById('chatContainer').classList.remove('hidden');
        loadTagData();
      } catch(err) {
        statusDiv.className = "bg-rose-50 text-rose-800 text-xs p-2.5 rounded-xl block font-bold";
        statusDiv.innerText = "Klaida: " + err.message;
        statusDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "Nusiųsti žinutę ir GPS vietą";
      }
    }

    function renderFinderChat(history) {
      var chatBox = document.getElementById('finderChatMessages');
      chatBox.innerHTML = history.map(function(m) {
        var isFinder = m.sender === 'finder';
        var bg = isFinder ? 'bg-emerald-700 text-white ml-auto' : 'bg-slate-800 text-slate-200 mr-auto';
        var label = isFinder ? 'Jūs' : 'Savininkas';
        return `<div class="max-w-[85%] p-2.5 rounded-2xl ${bg}"><div class="text-[9px] font-bold opacity-70 mb-0.5">${label}</div><div class="whitespace-pre-wrap">${m.text}</div></div>`;
      }).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendFinderReply() {
      var input = document.getElementById('finderReplyInput');
      var text = input.value.trim();
      if (!text) return;

      var res = await fetch(SUPABASE_URL + "/rest/v1/tags?id=eq." + encodeURIComponent(currentTagId) + "&select=chat_history", {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      var d = await res.json();
      var history = [];
      try { history = JSON.parse(d[0].chat_history || '[]'); } catch(e){}

      history.push({ sender: 'finder', text: text, time: new Date().toISOString() });

      await fetch(SUPABASE_URL + "/rest/v1/tags?id=eq." + encodeURIComponent(currentTagId), {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_history: JSON.stringify(history) })
      });
      input.value = '';
      loadTagData();
    }
  </script>
</body>
</html>
