<!DOCTYPE html><html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QR Hope – Radėjo vaizdas</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}</style></head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col justify-between p-4">
<header class="max-w-md mx-auto w-full py-2 flex justify-between items-center border-b border-slate-200">
<div class="flex items-center space-x-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span><span class="text-lg font-black tracking-tight text-slate-900">QR<span class="text-emerald-800">HOPE</span></span></div>
<a id="backToDashBtn" href="dashboard.html" class="text-xs font-bold bg-white text-slate-700 border border-slate-300 px-2.5 py-1 rounded-md hover:bg-slate-50"><i class="fa-solid fa-arrow-left mr-1"></i>Pultas</a>
</header>
<main class="max-w-md mx-auto w-full my-6">
<div id="loadingBox" class="bg-white border rounded-3xl p-6 text-center text-xs font-bold text-slate-500">Kraunami žymos duomenys...</div>
<div id="contentBox" class="hidden bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
<div class="flex justify-between items-start">
<div><span id="typeBadge" class="text-[10px] font-black uppercase bg-emerald-50 text-emerald-800 px-2.5 py-0.5 rounded-full"></span><h1 id="tagName" class="text-xl font-black text-slate-950 mt-1"></h1></div>
<span id="tagIdBadge" class="text-xs font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded"></span>
</div>
<div id="lostBanner" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-2">
<div class="flex items-center space-x-2 text-rose-700 font-black text-xs uppercase"><i class="fa-solid fa-triangle-exclamation"></i><span>Objektas pažymėtas kaip pamestas!</span></div>
<p id="lostMessage" class="text-xs text-rose-950 font-medium"></p>
<div id="rewardBadge" class="hidden text-xs font-black text-emerald-800 bg-emerald-100/70 border border-emerald-300 p-2 rounded-xl text-center"></div>
</div>
<div class="space-y-2 pt-2">
<a id="callBtn" href="#" class="w-full flex items-center justify-center space-x-2 bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3 rounded-2xl transition text-xs shadow-sm"><i class="fa-solid fa-phone"></i><span>Skambinti savininkui</span></a>
<button onclick="sendGpsLocation()" id="gpsBtn" class="w-full flex items-center justify-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 rounded-2xl transition text-xs border border-slate-300 cursor-pointer"><i class="fa-solid fa-location-dot text-emerald-700"></i><span>Nusiųsti radimo vietą (GPS)</span></button>
</div>
<div id="gpsStatus" class="hidden text-xs p-2.5 rounded-xl text-center font-bold"></div>
</div>
</main>
<footer class="max-w-md mx-auto w-full text-center text-[10px] text-slate-400 py-3">QR Hope &copy; 2026.</footer>
<script>
var SUPABASE_URL="https://nhnyvztyvovgxbbwmlxx.supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A",currentTag=null;
document.addEventListener("DOMContentLoaded",async function(){
var id=new URLSearchParams(window.location.search).get('id');
if(!id){document.getElementById('loadingBox').innerText="Žymos ID nenurodytas";return;}
id=id.toUpperCase();
document.getElementById('backToDashBtn').href=`dashboard.html?id=${id}`;
try{
var res=await fetch(`${SUPABASE_URL}/rest/v1/tags?id=eq.${encodeURIComponent(id)}&select=*`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
var data=await res.json();
if(!data||!data.length){document.getElementById('loadingBox').innerText="Žyma nerasta";return;}
currentTag=data[0];
document.getElementById('loadingBox').classList.add('hidden');
document.getElementById('contentBox').classList.remove('hidden');
document.getElementById('tagName').innerText=currentTag.name||'Gaminys';
document.getElementById('tagIdBadge').innerText='#'+currentTag.id;
var typeNames={'pet':'Augintinis','item':'Daiktas','sos':'SOS'};
document.getElementById('typeBadge').innerText=typeNames[currentTag.type]||'Daiktas';
if(currentTag.emergency_phone){document.getElementById('callBtn').href='tel:'+currentTag.emergency_phone;}else{document.getElementById('callBtn').classList.add('hidden');}
if(currentTag.lost_mode){
document.getElementById('lostBanner').classList.remove('hidden');
document.getElementById('lostMessage').innerText=currentTag.lost_message||'Savininkas ieško šio objekto. Prašome susisiekti.';
if(currentTag.reward){document.getElementById('rewardBadge').classList.remove('remove');document.getElementById('rewardBadge').classList.remove('hidden');document.getElementById('rewardBadge').innerText='🎁 Siūlomas atlygis: '+currentTag.reward;}
}
}catch(e){document.getElementById('loadingBox').innerText="Klaida: "+e.message;}
});
function sendGpsLocation(){
var st=document.getElementById('gpsStatus'),btn=document.getElementById('gpsBtn');
if(!navigator.geolocation){alert("Geolokacija nepalaikoma naršyklėje");return;}
btn.disabled=true;btn.innerText="Nustatoma vieta...";
navigator.geolocation.getCurrentPosition(function(pos){
var lat=pos.coords.latitude,lng=pos.coords.longitude;
var mapUrl=`https://maps.google.com/?q=${lat},${lng}`;
var bodyText=encodeURIComponent(`Labas, radau tavo objektą #${currentTag.id}! Vieta žemėlapyje: ${mapUrl}`);
var smsUrl=`sms:${currentTag.emergency_phone}?body=${bodyText}`;
st.className="bg-emerald-50 text-emerald-800 text-xs p-2.5 rounded-xl block font-bold";
st.innerHTML=`Vieta nustatyta! <a href="${smsUrl}" class="underline text-emerald-900 block mt-1">Spauskite čia, kad nusiųstumėte SMS savininkui 📍</a>`;
btn.disabled=false;btn.innerText="Nusiųsti radimo vietą (GPS)";
},function(err){
st.className="bg-rose-50 text-rose-800 text-xs p-2.5 rounded-xl block font-bold";
st.innerText="Nepavyko gauti vietos: leiskite naršyklei prieigą prie GPS.";
btn.disabled=false;btn.innerText="Nusiųsti radimo vietą (GPS)";
});
}
</script></body></html>
