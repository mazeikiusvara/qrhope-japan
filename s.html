<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – Radėjo vaizdas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col justify-between p-4">

  <header class="max-w-md mx-auto w-full py-2 flex justify-between items-center border-b border-slate-200">
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
      <span class="text-lg font-black tracking-tight text-slate-900">QR<span class="text-emerald-800">HOPE</span></span>
    </div>
    <a id="backToDashBtn" href="#" class="hidden text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-300 px-3 py-1.5 rounded-xl hover:bg-emerald-100 transition">
      <i class="fa-solid fa-arrow-left mr-1"></i>Grįžti į pultą
    </a>
  </header>

  <main class="max-w-md mx-auto w-full my-6">
    <div id="loadingBox" class="bg-white border rounded-3xl p-6 text-center text-xs font-bold text-slate-500">
      Kraunami duomenys...
    </div>

    <div id="contentBox" class="hidden bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
      <div class="flex justify-between items-start">
        <div>
          <span id="typeBadge" class="text-[10px] font-black uppercase bg-emerald-50 text-emerald-800 px-2.5 py-0.5 rounded-full">Daiktas</span>
          <h1 id="tagName" class="text-xl font-black text-slate-950 mt-1"></h1>
        </div>
        <span id="tagIdBadge" class="text-xs font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded"></span>
      </div>

      <div id="lostBanner" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-2">
        <div class="flex items-center space-x-2 text-rose-700 font-black text-xs uppercase">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>Objektas pažymėtas kaip pamestas!</span>
        </div>
        <p id="lostMessage" class="text-xs text-rose-950 font-medium"></p>
        <div id="rewardBadge" class="hidden text-xs font-black text-emerald-800 bg-emerald-100/70 border border-emerald-300 p-2 rounded-xl text-center"></div>
      </div>

      <!-- TIESIOGINIS POKALBIS RADĖJUI -->
      <div class="bg-slate-900 text-slate-100 border border-slate-800 rounded-3xl p-4 shadow-xl space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <h2 class="text-xs font-black uppercase tracking-wider text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-comments"></i> Pokalbis su savininku
          </h2>
          <span id="gpsStatusText" class="text-[10px] text-emerald-400 font-bold">GPS aktyvus 📍</span>
        </div>

        <div id="finderChatMessages" class="bg-slate-950 border border-slate-800 rounded-2xl p-3 h-40 overflow-y-auto space-y-2 text-xs">
          <div class="text-slate-500 text-center italic">Parašykite žinutę savininkui...</div>
        </div>

        <div class="flex gap-2">
          <input id="finderReplyInput" type="text" placeholder="Jūsų žinutė savininkui..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-600" />
          <button onclick="sendFinderMessage()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition shadow-sm cursor-pointer">
            Siųsti
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="max-w-md mx-auto w-full text-center text-[10px] text-slate-400 py-3">
    QR Hope &copy; 2026.
  </footer>

  <script>
    var SUPABASE_URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";
    var currentTag = null;
    var userGpsUrl = "";

    document.addEventListener("DOMContentLoaded", async function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var isPreview = params.get('preview');

      if (!id) { document.getElementById('loadingBox').innerText = "Žymos ID nenurodytas"; return; }
      id = id.toUpperCase();

      if (isPreview === '1' || localStorage.getItem('qrhope_logged_tag_' + id)) {
        var backBtn = document.getElementById('backToDashBtn');
        backBtn.href = "dashboard.html?id=" + id;
        backBtn.classList.remove('hidden');
      }

      // Automatiškai gauname radėjo GPS vietą fonā
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          userGpsUrl = "https://maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        });
      }

      await loadTagForFinder(id);
      setInterval(function() { loadTagForFinder(id); }, 5000); // Atnaujina kas 5 sek.
    });

    async function loadTagForFinder(id) {
      try {
        var res = await fetch(SUPABASE_URL + "/rest/v1/tags?id=eq." + encodeURIComponent(id) + "&select=*", {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        var data = await res.json();
        if (!data || !data.length) { document.getElementById('loadingBox').innerText = "Žyma nerasta"; return; }
        
        currentTag = data[0];
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('contentBox').classList.remove('hidden');

        document.getElementById('tagName').innerText = currentTag.name || 'Gaminys';
        document.getElementById('tagIdBadge').innerText = '#' + currentTag.id;

        if (currentTag.lost_mode) {
          document.getElementById('lostBanner').classList.remove('hidden');
          document.getElementById('lostMessage').innerText = currentTag.lost_message || 'Savininkas ieško šio objekto.';
          if (currentTag.reward) {
            document.getElementById('rewardBadge').classList.remove('hidden');
            document.getElementById('rewardBadge').innerText = '🎁 Siūlomas atlygis: ' + currentTag.reward;
          }
        }

        // Renderiname pokalbį
        var chatBox = document.getElementById('finderChatMessages');
        var history = [];
        try { history = JSON.parse(currentTag.chat_history || '[]'); } catch(e){}

        if (history.length === 0) {
          chatBox.innerHTML = '<div class="text-slate-500 text-center italic py-4">Parašykite žinutę radę šį daiktą...</div>';
        } else {
          chatBox.innerHTML = history.map(function(m) {
            var isFinder = m.sender === 'finder';
            var bg = isFinder ? 'bg-emerald-900/80 text-emerald-100 ml-auto' : 'bg-slate-800 text-slate-200 mr-auto';
            var senderLabel = isFinder ? 'Jūs (Radėjas)' : 'Savininkas';
            return '<div class="max-w-[85%] p-2.5 rounded-xl ' + bg + '"><div class="text-[9px] font-bold opacity-70 mb-0.5">' + senderLabel + '</div><div>' + m.text + '</div></div>';
          }).join('');
          chatBox.scrollTop = chatBox.scrollHeight;
        }

      } catch(e) {}
    }

    async function sendFinderMessage() {
      var input = document.getElementById('finderReplyInput');
      var text = input.value.trim();
      if (!text) return;

      var history = [];
      try { history = JSON.parse(currentTag.chat_history || '[]'); } catch(e){}
      
      var fullMsg = text;
      if (userGpsUrl && history.length === 0) {
        fullMsg += " | GPS vieta: " + userGpsUrl;
      }

      history.push({ sender: 'finder', text: fullMsg, time: new Date().toISOString() });

      try {
        await fetch(SUPABASE_URL + "/rest/v1/tags?id=eq." + encodeURIComponent(currentTag.id), {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_history: JSON.stringify(history), lost_message: "🚨 RADĖJAS: " + fullMsg })
        });
        input.value = '';
        await loadTagForFinder(currentTag.id);
      } catch(e) {
        alert("Klaida siunčiant: " + e.message);
      }
    }
  </script>
</body>
</html>
