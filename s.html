  <script>
    const SUPABASE_URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co";
    // Teisingas JWT anon raktas (pirmoji raidė maža 'e'):
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";

    let currentTag = null;

    async function loadTagData() {
      const urlParams = new URLSearchParams(window.location.search);
      const tagId = urlParams.get('id') || 'SOS-001';

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/tags?id=eq.${encodeURIComponent(tagId)}&select=*`, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const dataList = await response.json();
        document.getElementById('loader').classList.add('hidden');

        if (!dataList || dataList.length === 0 || dataList.error) {
          document.getElementById('errorView').classList.remove('hidden');
          return;
        }

        const data = dataList[0];
        currentTag = data;
        document.getElementById('mainCard').classList.remove('hidden');

        if (data.type === 'pet') {
          document.getElementById('petView').classList.remove('hidden');
          document.getElementById('petName').innerText = data.name;
          document.getElementById('petDetails').innerText = (data.details || '') + (data.age ? ' • ' + data.age : '');
          if (data.reward) {
            document.getElementById('petReward').innerText = data.reward;
          } else {
            document.getElementById('petRewardBadge').classList.add('hidden');
          }
        } else {
          document.getElementById('sosView').classList.remove('hidden');
          document.getElementById('sosName').innerText = data.name;
          document.getElementById('sosAge').innerText = data.age || '';
          document.getElementById('sosDetails').innerText = data.details || 'Nenurodyta';
          document.getElementById('sosCritical').innerText = data.critical_info || 'Nenurodyta';
        }
      } catch (err) {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('errorView').classList.remove('hidden');
      }
    }

    function triggerCall() {
      if (currentTag && currentTag.emergency_phone) {
        window.location.href = "tel:" + currentTag.emergency_phone;
      } else {
        alert("Sistemos klaida: kontaktas nerastas.");
      }
    }

    function sendLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const mapUrl = `https://maps.google.com/?q=${lat},${lon}`;
          alert(`【GPS Vieta Nustatyta】\nKoordinatės: ${lat.toFixed(4)}, ${lon.toFixed(4)}\nNuoroda: ${mapUrl}`);
        }, () => {
          alert("Prašome leisti prieigą prie buvimo vietos.");
        });
      }
    }

    loadTagData();
  </script>
