<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – スキャン情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 font-sans">

  <!-- Krovimo indikatorius -->
  <div id="loader" class="text-center py-10">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-600 mb-3"></i>
    <p class="text-xs font-bold text-slate-500">データを読み込み中... (Kraunami duomenys...)</p>
  </div>

  <!-- Klaidos pranešimas -->
  <div id="errorView" class="hidden w-full max-w-sm bg-white rounded-3xl p-6 text-center shadow-xl border border-red-200">
    <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i>
    <h3 class="font-black text-slate-800 text-lg">タグが見つかりません</h3>
    <p class="text-xs text-slate-500 mt-1" id="errorMsg">Šis pakabuko ID sistemoje neegzistuoja arba dar neaktyvuotas.</p>
  </div>

  <!-- Pagrindinė kortelė -->
  <div id="mainCard" class="hidden w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- SOS Medicininis Vaizdas -->
    <div id="sosView" class="hidden">
      <div class="bg-red-600 text-white p-5 text-center">
        <div class="flex items-center justify-center gap-2 mb-1">
          <i class="fa-solid fa-truck-medical text-2xl animate-pulse"></i>
          <h2 class="text-xl font-black uppercase tracking-wider">緊急医療情報 (SOS)</h2>
        </div>
        <p class="text-[11px] text-red-100 uppercase tracking-widest font-bold">QR Hope 見守りシステム</p>
      </div>

      <div class="p-5 space-y-4">
        <div class="flex justify-between items-baseline border-b pb-3">
          <div>
            <span class="text-[10px] uppercase font-bold text-slate-400 block">氏名 (Vardas)</span>
            <span class="text-2xl font-black text-slate-900" id="sosName">---</span>
          </div>
          <div class="text-right">
            <span class="text-[10px] uppercase font-bold text-slate-400 block">年齢 (Amžius)</span>
            <span class="text-base font-bold text-slate-700" id="sosAge">---</span>
          </div>
        </div>

        <div class="bg-red-50 border border-red-200 rounded-2xl p-3.5 space-y-2 text-xs">
          <div>
            <span class="text-slate-500 font-bold block mb-0.5">既往症・詳細 (Būklė / Diagnozė):</span>
            <span class="font-extrabold text-slate-900" id="sosDetails">---</span>
          </div>
          <div class="border-t border-red-100 pt-2">
            <span class="text-slate-500 font-bold block mb-0.5">医療情報
