<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – Gamintojų portalas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- Navigacija -->
  <header class="max-w-4xl mx-auto w-full py-4 flex justify-between items-center border-b border-slate-200">
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-slate-900"></span>
      <span class="text-xl font-black tracking-tight text-slate-900">QR<span class="text-emerald-700">HOPE</span> <span class="text-xs bg-slate-900 text-white px-2 py-0.5 rounded ml-1">B2B</span></span>
    </div>
    <div id="authNav" class="hidden items-center space-x-3 text-xs">
      <span id="companyBadge" class="font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200"></span>
      <button onclick="logoutMfg()" class="text-rose-600 font-bold hover:underline">Atsijungti</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full my-6">

    <!-- 1. Prisijungimo forma -->
    <div id="loginSection" class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-5">
      <div>
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Gamintojo prieiga</span>
        <h1 class="text-2xl font-black text-slate-900 mt-1">Gamybos portalas</h1>
        <p class="text-xs text-slate-500 mt-1">Prisijunkite norėdami generuoti naujas žymų partijas ir atsisiųsti gamybos failus.</p>
      </div>

      <form onsubmit="handleMfgLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Serijos prefiksas (3–6 raidės)</label>
          <input id="mfgPrefix" type="text" required placeholder="Pvz., BAGG" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 font-mono text-slate-900 font-bold uppercase focus:outline-none focus:border-slate-800" />
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Gamybos prieigos raktas</label>
          <input id="mfgKey" type="password" required placeholder="••••••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-900 font-mono focus:outline-none focus:border-slate-800" />
        </div>

        <button id="loginBtn" type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-sm text-sm">
          Prisijungti prie gamybos
        </button>
      </form>
      <div id="loginErr" class="hidden bg-rose-50 border border-rose-200 text-rose-800 text-xs p-3 rounded-xl text-center"></div>
    </div>

    <!-- 2. Partijų generavimo valdymo pultas -->
    <div id="mfgDashboard" class="hidden space-y-6">

      <!-- Informacinis skydelis -->
      <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 id="dashTitle" class="text-xl font-black text-slate-900">Gamybos valdymo pultas</h2>
          <p id="dashSub" class="text-xs text-slate-500 mt-1"></p>
        </div>
        <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center space-x-2">
          <i class="fa-solid fa-industry"></i>
          <span>Serija aktyvi gamybai</span>
        </div>
      </div>

      <!-- Naujos partijos generavimo forma -->
      <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
        <h3 class="text-sm font-bold text-slate-900 flex items-center">
          <i class="fa-solid fa-barcode mr-2 text-slate-700"></i>
          Generuoti naują žymų partiją
        </h3>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Kiekis (vnt.)</label>
            <input id="batchQty" type="number" min="1" max="5000" value="50" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-bold focus:outline-none focus:border-slate-800" />
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Pradinis numeris</label>
            <input id="batchStartNum" type="number" min="1" value="1001" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-bold focus:outline-none focus:border-slate-800" />
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Gaminio paskirtis</label>
            <select id="batchType" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 focus:outline-none focus:border-slate-800">
              <option value="item">Lagaminai / Krepšiai / Įrankiai</option>
              <option value="pet">Antkakliai gyvūnams</option>
              <option value="sos">Darbo rūbai / Apsauga</option>
            </select>
          </div>
        </div>

        <button onclick="generateBatch()" id="genBtn" class="bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3 px-6 rounded-xl text-xs transition flex items-center justify-center space-x-2 shadow-sm">
          <i class="fa-solid fa-file-csv"></i>
          <span>Generuoti ir atsisiųsti gamybos CSV</span>
        </button>

        <p id="genStatus" class="text-xs font-mono"></p>
      </div>

    </div>

  </main>

  <footer class="max-w-4xl mx-auto w-full text-center text-[11px] text-slate-400 py-4">
    QR Hope &copy; 2026. Gamintojų API ir serijų valdymo platforma.
  </footer>

  <script>
    const SUPABASE_URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";

    let currentMfg = null;

    async function handleMfgLogin(e) {
      e.preventDefault();
      const prefix = document.getElementById('mfgPrefix').value.trim().toUpperCase();
      const key = document.getElementById('mfgKey').value.trim();
      const errBox = document.getElementById('loginErr');
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerText = "Tikrinama...";
      errBox.classList.add('hidden');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/manufacturers?prefix=eq.${encodeURIComponent(prefix)}&access_key=eq.${encodeURIComponent(key)}&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const data = await res.json();

        if (data && data.length > 0) {
          currentMfg = data[0];
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('mfgDashboard').classList.remove('hidden');
          document.getElementById('authNav').classList.remove('hidden');
          document.getElementById('authNav').classList.add('flex');
          
          document.getElementById('companyBadge').innerText = `${currentMfg.company_name} [${currentMfg.prefix}]`;
          document.getElementById('dashTitle').innerText = `${currentMfg.company_name} – Serija ${currentMfg.prefix}`;
          document.getElementById('dashSub').innerText = `Visi šio gamintojo kodai prasidės: ${currentMfg.prefix}-XXXX`;
        } else {
          errBox.innerText = "Neteisingas serijos kodas arba prieigos raktas.";
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = "Ryšio klaida su serveriu.";
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "Prisijungti prie gamybos";
      }
    }

    // Atsitiktinio apsaugos rakto generavimas
    function makeSecret(len = 6) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let res = "";
      for (let i = 0; i < len; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return res;
    }

    async function generateBatch() {
      const qty = parseInt(document.getElementById('batchQty').value);
      const startNum = parseInt(document.getElementById('batchStartNum').value);
      const type = document.getElementById('batchType').value;
      const genBtn = document.getElementById('genBtn');
      const status = document.getElementById('genStatus');

      if (!qty || qty <= 0 || !startNum) return;

      genBtn.disabled = true;
      status.innerText = "Ruošiama partija ir registruojama sistemoje...";
      status.className = "text-xs text-amber-600 font-mono";

      const tagsPayload = [];
      const csvRows = [
        ["ID", "NFC_URL", "SECRET_KEY", "TYPE", "MANUFACTURER"]
      ];

      for (let i = 0; i < qty; i++) {
        const currentId = `${currentMfg.prefix}-${startNum + i}`;
        const secret = makeSecret(6);
        const targetUrl = `https://qrhope-japan.vercel.app/s.html?id=${currentId}`;

        tagsPayload.push({
          id: currentId,
          type: type,
          name: `${currentMfg.company_name} Gaminys`,
          manufacturer_prefix: currentMfg.prefix,
          activation_secret: secret,
          status: 'batch_ready',
          emergency_phone: '+37000000000',
          pin_code: '1234'
        });

        csvRows.push([currentId, targetUrl, secret, type, currentMfg.company_name]);
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tags`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(tagsPayload)
        });

        if (!res.ok) throw new Error("Duomenų įrašymo klaida");

        // Formuojame ir atsisiunčiame CSV failą
        let csvContent = "data:text/csv;charset=utf-8," 
          + csvRows.map(e => e.join(",")).join("\n");

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Gamybos_Partija_${currentMfg.prefix}_${startNum}-${startNum + qty - 1}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        status.innerText = `✅ Sėkmingai sugeneruota ${qty} vnt.! CSV failas paruoštas.`;
        status.className = "text-xs text-emerald-700 font-mono font-bold";
        document.getElementById('batchStartNum').value = startNum + qty;

      } catch (err) {
        status.innerText = "❌ Klaida generuojant partiją: " + err.message;
        status.className = "text-xs text-rose-600 font-mono";
      } finally {
        genBtn.disabled = false;
      }
    }

    function logoutMfg() {
      window.location.reload();
    }
  </script>
</body>
</html>
