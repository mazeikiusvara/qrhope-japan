<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Hope – B2B Gamintojai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 text-xs min-h-screen p-3 sm:p-5 flex flex-col justify-between">
  <header class="max-w-4xl mx-auto w-full py-2 flex justify-between items-center border-b border-slate-200">
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
      <span class="text-base font-black text-slate-900">QR HOPE <span class="text-[10px] bg-indigo-900 text-white px-2 py-0.5 rounded font-bold">B2B</span></span>
    </div>
    <div class="flex items-center space-x-2">
      <a href="index.html" class="bg-white border border-slate-300 font-bold px-2 py-1 rounded">Pradžia</a>
      <button id="logoutBtn" onclick="logout()" class="hidden text-rose-600 font-bold">Atsijungti</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full my-3">
    <!-- PRISIJUNGIMAS -->
    <div id="authBox" class="max-w-xs mx-auto bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
      <h1 class="text-sm font-black text-slate-900">Gamintojo prisijungimas</h1>
      <form onsubmit="handleAuth(event)" class="space-y-2">
        <input id="partnerId" type="text" required placeholder="Partneris (pvz. BALTICBAGS)" class="w-full bg-slate-50 border p-2 rounded-xl font-bold" />
        <input id="partnerSecret" type="password" required placeholder="Slaptažodis (1234)" class="w-full bg-slate-50 border p-2 rounded-xl" />
        <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl">Prisijungti</button>
      </form>
      <p id="authErr" class="hidden text-rose-600 text-center font-bold"></p>
    </div>

    <!-- PULTAS -->
    <div id="portalContent" class="hidden space-y-3">
      <div class="bg-white border rounded-2xl p-3 flex justify-between items-center">
        <div>
          <h2 class="font-black text-slate-900 text-sm">Partijų pultas</h2>
          <span id="partnerNameText" class="text-[11px] text-slate-500 font-bold"></span>
        </div>
        <button onclick="loadTags()" class="bg-slate-100 hover:bg-slate-200 font-bold px-2.5 py-1 rounded-lg border">
          <i class="fa-solid fa-rotate"></i> Atnaujinti
        </button>
      </div>

      <!-- GENERAVIMAS -->
      <div class="bg-white border rounded-2xl p-4 space-y-3">
        <h3 class="font-bold text-slate-900 border-b pb-1">Nauja partija</h3>
        <form onsubmit="handleGenerate(event)" class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-bold text-slate-600 block mb-0.5">Tipas</label>
            <select id="itemType" class="w-full bg-slate-50 border p-2 rounded-xl font-bold">
              <option value="item">Daiktas / Lagaminas</option>
              <option value="pet">Augintinis</option>
              <option value="sos">SOS / Medicina</option>
            </select>
          </div>
          <div>
            <label class="font-bold text-slate-600 block mb-0.5">Technologija</label>
            <select id="tagTech" class="w-full bg-slate-50 border p-2 rounded-xl font-bold text-indigo-900">
              <option value="nfc">📱 NFC Žyma</option>
              <option value="qr">📷 QR Kodas</option>
              <option value="hybrid">⚡ Hibridas (NFC+QR)</option>
            </select>
          </div>
          <div>
            <label class="font-bold text-slate-600 block mb-0.5">Prefix</label>
            <input id="prefixInput" type="text" required placeholder="BAGS arba PET" class="w-full bg-slate-50 border p-2 rounded-xl uppercase font-mono font-bold" />
          </div>
          <div>
            <label class="font-bold text-slate-600 block mb-0.5">Kiekis (vnt.)</label>
            <input id="qtyInput" type="number" min="1" max="150" value="10" required class="w-full bg-slate-50 border p-2 rounded-xl font-bold" />
          </div>
          <button id="genBtn" type="submit" class="col-span-2 bg-indigo-900 text-white font-bold py-2.5 rounded-xl">
            Generuoti ir išsaugoti
          </button>
        </form>
        <p id="genStatus" class="hidden p-2 rounded-xl text-center font-bold"></p>
      </div>

      <!-- SĄRAŠAS -->
      <div class="bg-white border rounded-2xl p-4 space-y-2">
        <div class="flex justify-between items-center border-b pb-1.5">
          <span class="font-bold text-slate-900">Sukurtos žymos (<span id="tagCount">0</span> vnt.)</span>
          <button onclick="downloadCSV()" class="bg-emerald-800 text-white font-bold px-2.5 py-1 rounded-lg">
            <i class="fa-solid fa-file-csv"></i> CSV
          </button>
        </div>
        <div class="overflow-x-auto max-h-72">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase border-b">
                <th class="p-1.5">ID</th>
                <th class="p-1.5">Gaminys</th>
                <th class="p-1.5">Tech</th>
                <th class="p-1.5">Secret</th>
                <th class="p-1.5 text-right">Veiksmai</th>
              </tr>
            </thead>
            <tbody id="tagsTable" class="divide-y divide-slate-100 font-mono">
              <tr><td colspan="5" class="p-3 text-center text-slate-400 font-sans">Kraunama...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- REDAGAVIMAS -->
  <div id="editModal" class="hidden fixed inset-0 bg-slate-950/60 flex items-center justify-center p-3 z-50">
    <div class="bg-white rounded-2xl p-4 max-w-xs w-full space-y-2.5">
      <div class="flex justify-between items-center border-b pb-1">
        <span class="font-bold text-slate-900">Redaguoti <span id="editTagId" class="text-emerald-700 font-mono"></span></span>
        <button onclick="closeEdit()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="saveEdit(event)" class="space-y-2">
        <input id="editName" type="text" required placeholder="Gaminio pavadinimas" class="w-full bg-slate-50 border p-2 rounded-xl" />
        <select id="editTech" class="w-full bg-slate-50 border p-2 rounded-xl font-bold">
          <option value="nfc">📱 NFC Žyma</option>
          <option value="qr">📷 QR Kodas</option>
          <option value="hybrid">⚡ Hibridas</option>
        </select>
        <input id="editSecret" type="text" maxlength="6" placeholder="Pakuotės kodas" class="w-full bg-slate-50 border p-2 rounded-xl uppercase font-mono font-bold" />
        <div class="flex space-x-1 pt-1">
          <button type="button" onclick="closeEdit()" class="flex-1 bg-slate-100 py-1.5 rounded-xl font-bold">Atšaukti</button>
          <button type="submit" class="flex-1 bg-emerald-800 text-white py-1.5 rounded-xl font-bold">Išsaugoti</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="max-w-4xl mx-auto w-full text-center text-[10px] text-slate-400 py-2">
    QR Hope &copy; 2026.
  </footer>

  <script>
    var URL = "https://nhnyvztyvovgxbbwmlxx.supabase.co/rest/v1/tags";
    var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obnl2enR5dm92Z3hiYndtbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjU0NDcsImV4cCI6MjEwNjgwMTQ0N30.FlfiRdNzID31aSwGM1gPf2KVliE1fScVGz-Iwopr_0A";
    var H = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
    var tags = [], curTag = null;

    function handleAuth(e) {
      e.preventDefault();
      var id = document.getElementById('partnerId').value.trim();
      var p = document.getElementById('partnerSecret').value.trim();
      if (p === 'admin' || p === '1234' || id.length > 2) {
        sessionStorage.setItem('qrhope_p', id.toUpperCase());
        openDashboard(id.toUpperCase());
      } else {
        document.getElementById('authErr').innerText = "Neteisingi duomenys";
        document.getElementById('authErr').classList.remove('hidden');
      }
    }

    function openDashboard(n) {
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('portalContent').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('partnerNameText').innerText = "Partneris: " + n;
      loadTags();
    }

    function rndSec() {
      var s = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ", r = "";
      for (var i = 0; i < 6; i++) r += s.charAt(Math.floor(Math.random() * s.length));
      return r;
    }

    async function loadTags() {
      var b = document.getElementById('tagsTable');
      try {
        var r = await fetch(URL + "?select=*&order=id.desc", { headers: H });
        tags = await r.json();
        document.getElementById('tagCount').innerText = tags.length;
        b.innerHTML = tags.map(function(t) {
          var tech = t.tag_technology === 'nfc' ? '📱 NFC' : (t.tag_technology === 'hybrid' ? '⚡ Hibrid' : '📷 QR');
          return `<tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="p-1.5 font-bold text-slate-900">${t.id}</td>
            <td class="p-1.5 font-sans truncate max-w-[100px]">${t.name || '-'}</td>
            <td class="p-1.5 font-sans font-bold text-indigo-700">${tech}</td>
            <td class="p-1.5 font-bold text-emerald-700">${t.activation_secret || '-'}</td>
            <td class="p-1.5 text-right space-x-1 font-sans">
              <a href="s.html?id=${t.id}&preview=1" target="_blank" class="bg-slate-100 p-1 rounded font-bold" title="Tik gaminys"><i class="fa-solid fa-eye"></i></a>
              <button onclick="editModal('${t.id}')" class="bg-indigo-50 text-indigo-700 p-1 rounded font-bold"><i class="fa-solid fa-pen"></i></button>
              <button onclick="delTag('${t.id}')" class="bg-rose-50 text-rose-700 p-1 rounded font-bold"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
        }).join('');
      } catch(e) { b.innerHTML = '<tr><td colspan="5" class="p-2 text-center text-rose-500">Klaida kraunant</td></tr>'; }
    }

    async function handleGenerate(e) {
      e.preventDefault();
      var pre = document.getElementById('prefixInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      var count = parseInt(document.getElementById('qtyInput').value, 10) || 10;
      var type = document.getElementById('itemType').value;
      var tech = document.getElementById('tagTech').value;
      var btn = document.getElementById('genBtn'), st = document.getElementById('genStatus');
      btn.disabled = true;

      var start = Math.floor(1000 + Math.random() * 8000), list = [];
      for (var i = 0; i < count; i++) {
        var id = pre + (start + i);
        list.push({ id: id, type: type, tag_technology: tech, activation_secret: rndSec(), status: 'batch_ready', emergency_phone: '', pin_code: '', name: 'Gaminys #' + id });
      }

      try {
        var r = await fetch(URL, { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=representation' }), body: JSON.stringify(list) });
        var d = await r.json();
        if (!r.ok) throw new Error(d.message || JSON.stringify(d));
        st.className = "bg-emerald-50 text-emerald-800 p-2 rounded-xl block font-bold";
        st.innerText = "✅ Sukurta " + list.length + " žymų!";
        loadTags();
      } catch(err) {
        st.className = "bg-rose-50 text-rose-800 p-2 rounded-xl block font-bold text-left";
        st.innerText = "Klaida: " + err.message;
      } finally { btn.disabled = false; }
    }

    async function delTag(id) {
      if (!confirm("Ištrinti #" + id + "?")) return;
      var r = await fetch(URL + "?id=eq." + encodeURIComponent(id), { method: 'DELETE', headers: H });
      if (r.ok) loadTags(); else alert("Nepavyko ištrinti");
    }

    function editModal(id) {
      curTag = tags.find(function(t){ return t.id === id; });
      if (!curTag) return;
      document.getElementById('editTagId').innerText = '#' + curTag.id;
      document.getElementById('editName').value = curTag.name || '';
      document.getElementById('editTech').value = curTag.tag_technology || 'qr';
      document.getElementById('editSecret').value = curTag.activation_secret || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEdit() { document.getElementById('editModal').classList.add('hidden'); }

    async function saveEdit(e) {
      e.preventDefault();
      var body = {
        name: document.getElementById('editName').value.trim(),
        tag_technology: document.getElementById('editTech').value,
        activation_secret: document.getElementById('editSecret').value.trim().toUpperCase()
      };
      var r = await fetch(URL + "?id=eq." + encodeURIComponent(curTag.id), { method: 'PATCH', headers: H, body: JSON.stringify(body) });
      if (r.ok) { closeEdit(); loadTags(); } else alert("Klaida saugant");
    }

    function downloadCSV() {
      if (!tags.length) return;
      var c = "ID,Name,Technology,ActivationSecret,Url\n";
      tags.forEach(function(t){ c += `${t.id},"${t.name||''}",${t.tag_technology||'qr'},${t.activation_secret||''},${window.location.origin}/s.html?id=${t.id}\n`; });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([c], { type: 'text/csv' }));
      a.download = `QRHOPE_${tags.length}PCS.csv`;
      a.click();
    }

    function logout() { sessionStorage.removeItem('qrhope_p'); window.location.reload(); }

    document.addEventListener("DOMContentLoaded", function() {
      var p = sessionStorage.getItem('qrhope_p');
      if (p) openDashboard(p);
    });
  </script>
</body>
</html>
